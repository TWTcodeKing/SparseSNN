# Spikformer training recipe for CIFAR-10-DVS
# Ref: Zhou et al., "Spikformer" (ICLR 2023)
optimizer:
  type: adamw
  lr: 1e-4
  weight_decay: 0.06
  betas: [0.9, 0.999]
scheduler:
  type: cosine
  warmup_epochs: 10
  min_lr: 1e-6
epochs: 200
batch_size: 16
augmentation:
  auto_aug: false
  cutout: false
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  random_erasing: 0.0
regularization:
  label_smoothing: 0.0
  drop_path_rate: 0.0
snn:
  T: 16
