# MS-ResNet recipe for CIFAR-100
optimizer:
  type: sgd
  lr: 0.1
  weight_decay: 5e-4
  momentum: 0.9
scheduler:
  type: cosine
  warmup_epochs: 5
  min_lr: 0.0
epochs: 200
batch_size: 128
augmentation:
  auto_aug: false
  cutout: true
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
regularization:
  label_smoothing: 0.0
  drop_path_rate: 0.0
snn:
  T: 6
