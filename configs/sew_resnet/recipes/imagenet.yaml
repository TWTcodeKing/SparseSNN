# SEW-ResNet recipe for ImageNet
optimizer:
  type: sgd
  lr: 0.1
  weight_decay: 1e-4
  momentum: 0.9
scheduler:
  type: cosine
  warmup_epochs: 5
  min_lr: 0.0
epochs: 320
batch_size: 64
augmentation:
  auto_aug: true
  cutout: false
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  random_erasing: 0.0
regularization:
  label_smoothing: 0.0
  drop_path_rate: 0.0
snn:
  T: 4
