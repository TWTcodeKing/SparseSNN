# SEW-ResNet recipe for CIFAR-100
optimizer:
  type: sgd
  lr: 0.1
  weight_decay: 1e-4
  momentum: 0.9
scheduler:
  type: cosine
  warmup_epochs: 0
  min_lr: 0.0
epochs: 100
batch_size: 100
augmentation:
  auto_aug: false
  cutout: false
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
regularization:
  label_smoothing: 0.0
  drop_path_rate: 0.0
snn:
  T: 4
