# SpikingResformer transfer learning recipe for CIFAR-100
# Source: https://github.com/xyshi2000/SpikingResformer configs/transfer/cifar100.yaml
# Use with: tengine/transfer.py --recipe this_file.yaml

optimizer:
  type: adamw
  lr: 1e-4
  weight_decay: 0.01

scheduler:
  type: cosine
  warmup_epochs: 3
  min_lr: 1e-5

epochs: 150
batch_size: 128

augmentation:
  auto_aug: true    # rand-m9-n1-mstd0.4-inc1
  mixup_alpha: 0.5
  cutmix_alpha: 0.0

regularization:
  label_smoothing: 0.1

snn:
  T: 4

# Transfer-specific
img_size: 128
